  - hostname: felix.${NET_DOMAIN_NAME}
    ipAddress: 10.28.28.63
    controlPlane: true
    kernelModules:
      - name: zfs
    installDiskSelector:
      serial: "2231402813ED"
  #  nameservers: 
  #    - 10.28.1.1
    machineDisks:
      - device: /dev/disk/by-id/nvme-Micron_7450_MTFDKBG1T9TFR_223140281322
        partitions:
          - mountpoint: /var/mnt/sata
    networkInterfaces:
      - interface: bond0
        bond:
          mode: active-backup
          deviceSelectors: 
            - hardwareAddr: 58:47:ca:74:ff:71
              #driver: igc
        dhcp: true
        #vip:
        #  ip: ${clusterEndpointIP}
      - interface: bond1
        bond:
          mode: active-backup
          deviceSelectors: 
            - hardwareAddr: 58:47:ca:74:ff:74
              driver: igc
        mtu: 1500
        dhcp: true
        dhcpOptions:
          routeMetric: 4096
    patches:
    # Extra SSD to mount
      - &kubelet_extra_mounts |-
        machine:
          kubelet:
            extraMounts:
              - destination: /var/mnt/sata
                type: bind
                source: /var/mnt/sata
                options:
                  - rbind
                  - rshared
                  - rw

controlPlane:
  schematic:
    customization:
      extraKernelArgs:
        - net.ifnames=1
      systemExtensions:
        officialExtensions:
          - siderolabs/intel-ucode
          - siderolabs/i915-ucode
          - siderolabs/mei
          - siderolabs/gasket-driver #google coral pci driver
          - siderolabs/zfs

  patches:
    # Disable search domain everywhere
    - &disableSearchDomainPatch |-
      machine:
        network:
          disableSearchDomain: true

    # Disable Host DNS
    - |-
      machine:
        features:
          hostDNS:
            enabled: true
            resolveMemberNames: true
            forwardKubeDNSToHost: false

    # Enable KubePrism
    - &kubePrismPatch |-
      machine:
        features:
          kubePrism:
            enabled: true
            port: 7445

    # Cluster configuration
    - |-
      cluster:
        allowSchedulingOnMasters: true
        proxy:
          disabled: true
        coreDNS:
            disabled: true
        discovery:
          enabled: true
          registries:
            kubernetes:
              disabled: false
            service:
              disabled: true

    # ETCD configuration
    - |-
      cluster:
        etcd:
          advertisedSubnets:
            - 10.28.28.0/24

    # Disable default API server admission plugins.
    - |-
      - op: remove
        path: /cluster/apiServer/admissionControl

    # Enable K8s Talos API Access
    - |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles:
              - os:admin
            allowedKubernetesNamespaces:
              - system-upgrade
    
    # Kubelet configuration
    - |-
      machine:
        kubelet:
          extraArgs:
            rotate-server-certificates: true
          nodeIP:
            validSubnets:
                - 10.28.28.0/24

    # Configure containerd
    - &containerdPatch |-
      machine:
        files:
          - op: create
            path: /etc/cri/conf.d/20-customization.part
            content: |-
              [plugins."io.containerd.grpc.v1.cri"]
                enable_unprivileged_ports = true
                enable_unprivileged_icmp = true
          - op: overwrite
            path: /etc/nfsmount.conf
            permissions: 0o644
            content: |-
              [ NFSMount_Global_Options ]
              nfsvers=4.2
              hard=True
              noatime=True
              nodiratime=True
              rsize=131072
              wsize=131072
              nconnect=8

    # Custom sysctl settings
    - &sysctlPatch |-
      machine:
        sysctls:
          fs.inotify.max_queued_events: "65536"
          fs.inotify.max_user_instances: "8192"
          fs.inotify.max_user_watches: "524288"

    
    
    # Various udev rules
    - |-
      machine:
        udev:
          rules:
            # Intel GPU
            - SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="44", MODE="0660"
            # Google Coral USB Accelerator
            #- SUBSYSTEMS=="usb", ATTRS{idVendor}=="1a6e", ATTRS{idProduct}=="089a", GROUP="20", MODE="0660"
            #- SUBSYSTEMS=="usb", ATTRS{idVendor}=="18d1", ATTRS{idProduct}=="9302", GROUP="20", MODE="0660"
