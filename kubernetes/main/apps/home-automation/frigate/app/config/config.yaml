---
# yaml-language-server: $schema=https://frigate.zinn.ca/api/config/schema.json
logger:
  default: info
  # logs:
  #   frigate.record: debug

auth:
  enabled: false

mqtt:
  #host: mosquitto.home-automation.svc.cluster.local
  host: haos.nickeson.net
  port: 1883
  topic_prefix: frigate
  user: '{FRIGATE_MQTT_USERNAME}'
  password: '{FRIGATE_MQTT_PASSWORD}'

database:
  path: /config/frigate.db

detectors:
  coral:
    type: edgetpu
    device: pci
    #device: usb

ffmpeg:
  global_args: [-hide_banner, -loglevel, warning]
  #hwaccel_args: preset-intel-qsv-h264
  hwaccel_args: preset-vaapi
  output_args:
    record: preset-record-generic-audio-aac
  #output_args:
  #  record: preset-record-ubiquiti
  #  # rtmp: preset-rtmp-ubiquiti

snapshots:
  enabled: true
  timestamp: false
  bounding_box: true
  retain:
    default: 20

#record:
#  enabled: true
#  retain:
#    days: 20viewer
#    mode: all
#  events:
#    retain:
#      default: 20
#      mode: active_objects

#objects:
#  track: [person, dog, cat]
#  filters:
#    person:
#      min_area: 5000
#      max_area: 100000
#      threshold: 0.7

go2rtc:
  streams:
    kira:
      - rtsp://${CAMERA_USERNAME}:${CAMERA_PASSWORD}@10.28.20.31/cam/realmonitor?channel=1&subtype=0&authbasic=64

cameras:
  kira:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/kira
          roles:
            - record
        - path:
            rtsp://${CAMERA_USERNAME}:${CAMERA_PASSWORD}@10.28.20.31/cam/realmonitor?channel=1&subtype=1&authbasic=64
          roles:
            - detect
    detect:
      width: 640
      height: 480
      fps: 5
    record:
      enabled: true
      retain:
        days: 2
        mode: motion
      events:
        retain:
          default: 7
          mode: active_objects