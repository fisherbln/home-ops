---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piped
spec:
  chart:
    spec:
      chart: piped
      version: 6.0.2
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: piped
  interval: 30m
  values:
    automountServiceAccountToken: false

    postgresql:
      enabled: false

    backend:
      annotations:
        configmap.reloader.stakater.com/reload: piped-backend-config
      config:
        PORT: 8080
        HTTP_WORKERS: 4
        API_URL: https://piped-api.nickeson.net
        PROXY_PART: "https://piped-proxy.nickeson.net"
        DISABLE_REGISTRATION: true
        database:
          connection_url: jdbc:postgresql://postgres-primary.database.svc.cluster.local:5432/piped
          driver_class: org.postgresql.Driver
          secret:
            name: piped-db-secret
            username: user
            password: password
      podSecurityContext:
        runAsUser: &uid 1000
        runAsGroup: *uid
        fsGroup: *uid
        fsGroupChangePolicy: Always
      resources:
        requests:
          cpu: 10m
          memory: 500Mi
        limits:
          memory: 2000Mi

    frontend:
      env:
        BACKEND_HOSTNAME: piped-api.nickeson.net
      args:
        - -c
        - |
            sed -i s/pipedapi.kavin.rocks/$BACKEND_HOSTNAME/g /usr/share/nginx/html/assets/* &&
            sed -i 's/80;/8080;/g' /etc/nginx/conf.d/default.conf &&
            /docker-entrypoint.sh nginx -g 'daemon off;'
      service:
        main:
          ports:
            http:
              port: 8080
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 256Mi

    ingress:
      main:
        ingressClassName: "internal-nginx"
        annotations:
          external-dns.alpha.kubernetes.io/target: ingress-int.nickeson.net
          nginx.ingress.kubernetes.io/enable-cors: "true"
          nginx.ingress.kubernetes.io/cors-allow-origin: "https://piped.nickeson.net, https://piped-api.nickeson.net, https://piped-proxy.nickeson.net"
        hosts:
          - host: piped.nickeson.net
            paths:
              - path: "/"

      backend:
        ingressClassName: "internal-nginx"
        annotations:
          external-dns.alpha.kubernetes.io/target: ingress-int.nickeson.net
          nginx.ingress.kubernetes.io/enable-cors: "true"
          nginx.ingress.kubernetes.io/cors-allow-origin: "https://piped.nickeson.net, https://piped-api.nickeson.net, https://piped-proxy.nickeson.net"
        hosts:
          - host: piped-api.nickeson.net
            paths:
              - path: "/"

      ytproxy:
        ingressClassName: "internal-nginx"
        annotations:
          external-dns.alpha.kubernetes.io/target: ingress-int.nickeson.net
          nginx.ingress.kubernetes.io/enable-cors: "true"
          nginx.ingress.kubernetes.io/cors-allow-origin: "https://piped.nickeson.net, https://piped-api.nickeson.net, https://piped-proxy.nickeson.net"
        hosts:
          - host: piped-proxy.nickeson.net
            paths:
              - path: "/"
